<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライブ配信プロトタイプ</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh; height: 100dvh;
            color: #fff;
        }

        #app-container {
            position: relative;
            width: 100vw; height: 100vh; height: 100dvh;
            background: #000;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        #camera-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            background: #000;
            z-index: 1;
        }

        /* 配信準備中・待機用オーバーレイ */
        #standby-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 2; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 12px; transition: opacity 0.3s ease;
        }
        #standby-overlay h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
        #standby-overlay p { margin: 0; font-size: 13px; color: #8e8e93; }

        /* ニックネーム設定・変更モーダル */
        #name-input-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
        }

        .modal-card {
            background: rgba(30, 30, 35, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 24px; border-radius: 24px;
            text-align: center; width: 88%; max-width: 340px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .input-field {
            width: 100%; padding: 14px;
            margin: 18px 0; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15); background: rgba(0, 0, 0, 0.5);
            color: #fff; font-size: 15px; text-align: center; outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF2A54, #FF6445);
            color: white; border: none; padding: 14px 28px;
            font-size: 15px; font-weight: 700;
            border-radius: 30px; cursor: pointer; width: 100%;
            box-shadow: 0 8px 20px rgba(255, 42, 84, 0.35);
        }

        /* UIオーバーレイ */
        .overlay-layer {
            position: relative; z-index: 3;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between;
            pointer-events: none; padding: 16px;
        }

        .header {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 0, 0, 0.45); padding: 6px 14px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08);
            width: fit-content; pointer-events: auto;
        }
        .live-badge {
            background: linear-gradient(135deg, #FF2A54, #FF0040);
            padding: 3px 8px; border-radius: 6px;
            font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
        }

        .user-name-btn {
            font-size: 12px; font-weight: 600; color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: background 0.2s;
        }
        .user-name-btn:active { background: rgba(255, 255, 255, 0.25); }
        .user-id-tag { font-size: 10px; color: rgba(255, 255, 255, 0.5); font-weight: 400; }
        
        .btn-host-control {
            background: #34C759; border: none; color: white;
            padding: 6px 14px; border-radius: 16px; font-weight: 700;
            font-size: 12px; cursor: pointer; transition: background 0.2s;
        }
        .btn-host-control.is-live { background: #FF3B30; }

        /* チャット ＆ ギフトエリア */
        .bottom-section {
            pointer-events: auto;
            display: flex; flex-direction: column; gap: 12px;
            max-width: 480px; width: 100%; margin: 0 auto;
        }

        #chat-logs {
            height: 180px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            padding: 6px;
            mask-image: linear-gradient(to bottom, transparent, black 15%);
        }

        /* TikTok風 背景なしコメントスタイル */
        .chat-item {
            display: flex; flex-direction: column; gap: 2px;
            width: 100%;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 2px 8px rgba(0,0,0,0.6);
        }

        /* 1行目：ユーザー情報（小さめ） */
        .chat-header {
            display: flex; align-items: center; gap: 4px;
            font-size: 11px; color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
        }
        .chat-user { color: #FFD166; font-weight: 700; }
        .chat-id { font-size: 10px; color: rgba(255, 255, 255, 0.45); font-weight: 400; }
        .host-badge {
            background: #FF2A54; color: #fff; font-size: 9px; font-weight: 800;
            padding: 1px 5px; border-radius: 4px; text-shadow: none;
        }

        /* 2行目：コメント本文 */
        .chat-text {
            font-size: 14px; font-weight: 600; color: #ffffff;
            line-height: 1.3; word-break: break-all;
        }

        /* 2行構成のギフトシステムメッセージ */
        .chat-item.gift-notice {
            background: linear-gradient(135deg, rgba(255, 42, 84, 0.45), rgba(255, 123, 0, 0.45));
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px; border-radius: 16px;
            backdrop-filter: blur(8px);
            text-shadow: none; width: fit-content;
        }
        .gift-notice .chat-text {
            font-size: 13.5px; font-weight: 700; color: #FFF;
        }

        /* 操作バー */
        .action-bar {
            display: flex; gap: 8px; align-items: center;
            background: rgba(20, 20, 25, 0.65);
            padding: 6px 6px 6px 16px; border-radius: 30px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        #chat-input {
            flex: 1; background: transparent; border: none;
            color: #fff; font-size: 14px; outline: none;
        }
        #chat-input::placeholder { color: rgba(255,255,255,0.4); }

        .icon-btn {
            background: transparent; border: none;
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.15s, background 0.2s;
            flex-shrink: 0; color: #fff;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn-send { background: #fff; color: #000; }
        .icon-btn-gift {
            background: linear-gradient(135deg, #FF2A54, #FF7B00);
            box-shadow: 0 4px 12px rgba(255, 42, 84, 0.3);
        }

        /* ギフトドロワー */
        #gift-drawer {
            display: none;
            position: absolute; bottom: 85px; right: 16px; left: 16px;
            max-width: 400px; margin: 0 auto;
            background: rgba(25, 25, 30, 0.92);
            border-radius: 24px; padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            grid-template-columns: repeat(2, 1fr); gap: 10px;
            z-index: 10; pointer-events: auto;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .gift-card {
            background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 14px;
            text-align: center; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.2s, transform 0.1s;
        }
        .gift-card:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.12); }
        .gift-icon { font-size: 32px; margin-bottom: 4px; }
        .gift-name { font-size: 13px; font-weight: 700; color: #eee; }
        .gift-price { font-size: 12px; color: #FFB340; font-weight: 700; margin-top: 2px; }

        /* エフェクト表示 */
        #effect-container {
            position: absolute; top: 35%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20; pointer-events: none;
            text-align: center; width: 100%;
        }
        .gift-effect-text {
            font-size: 26px; font-weight: 900; color: #FFF;
            text-shadow: 0 4px 20px rgba(255, 42, 84, 0.8);
            animation: popUp 2.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.4) translateY(30px); }
            15% { opacity: 1; transform: scale(1.05) translateY(0); }
            80% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.9) translateY(-40px); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 待機・準備中画面 -->
        <div id="standby-overlay">
            <h3 id="standby-title">配信準備中</h3>
            <p id="standby-desc">配信者が準備を開くのをお待ちください...</p>
        </div>

        <!-- ニックネーム設定・変更モーダル -->
        <div id="name-input-modal" style="display: none;">
            <div class="modal-card">
                <h3 style="margin:0 0 8px 0; font-size:18px;">ニックネームの設定</h3>
                <p style="font-size: 12px; color: #8e8e93; margin:0;">コメントやギフトに表示されるお名前です</p>
                <input type="text" id="username-input" class="input-field" placeholder="例: ゲスト" maxlength="12">
                <button class="btn-primary" id="btn-save-name">保存して参加</button>
            </div>
        </div>

        <video id="camera-video" autoplay playsinline muted></video>

        <div class="overlay-layer">
            <div class="header">
                <span class="live-badge" id="live-badge">OFFLINE</span>
                <div class="user-name-btn" id="btn-edit-name">
                    <span id="role-display">接続中...</span>
                    <span id="user-id-display" class="user-id-tag"></span>
                </div>
                <button id="btn-host-toggle" class="btn-host-control" style="display: none;">配信開始</button>
            </div>

            <div id="effect-container"></div>

            <div id="gift-drawer">
                <div class="gift-card" onclick="sendGift('応援', '📣', '￥500')">
                    <div class="gift-icon">📣</div>
                    <div class="gift-name">応援</div>
                    <div class="gift-price">￥500</div>
                </div>
                <div class="gift-card" onclick="sendGift('アルコール', '🍺', '￥1,000')">
                    <div class="gift-icon">🍺</div>
                    <div class="gift-name">アルコール</div>
                    <div class="gift-price">￥1,000</div>
                </div>
                <div class="gift-card" onclick="sendGift('ウイスキー', '🥃', '￥3,000')">
                    <div class="gift-icon">🥃</div>
                    <div class="gift-name">ウイスキー</div>
                    <div class="gift-price">￥3,000</div>
                </div>
                <div class="gift-card" onclick="sendGift('シャンパン', '🍾', '￥10,000')">
                    <div class="gift-icon">🍾</div>
                    <div class="gift-name">シャンパン</div>
                    <div class="gift-price">￥1,000</div>
                </div>
            </div>

            <div class="bottom-section">
                <div id="chat-logs"></div>
                <div class="action-bar">
                    <input type="text" id="chat-input" placeholder="コメントを入力..." maxlength="50">
                    
                    <button class="icon-btn icon-btn-send" id="btn-send-chat" title="送信">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                    
                    <button class="icon-btn icon-btn-gift" id="btn-toggle-gift" title="ギフト">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let peerConnection;
        let userName = localStorage.getItem('live_user_name') || '';
        
        let userId = localStorage.getItem('live_user_id');
        if (!userId) {
            userId = '#' + Math.floor(1000 + Math.random() * 9000).toString(16).toUpperCase();
            localStorage.setItem('live_user_id', userId);
        }

        let isHost = false;
        let isBroadcasting = false;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const videoElement = document.getElementById('camera-video');
        const standbyOverlay = document.getElementById('standby-overlay');
        const liveBadge = document.getElementById('live-badge');
        const hostBtn = document.getElementById('btn-host-toggle');

        const urlParams = new URLSearchParams(window.location.search);
        const hostKey = urlParams.get('host');

        window.addEventListener('DOMContentLoaded', () => {
            if (hostKey) {
                isHost = true;
                socket.emit('register-broadcaster', hostKey);
            } else {
                initViewerMode();
            }
        });

        document.getElementById('btn-edit-name').addEventListener('click', () => {
            if (isHost) return;
            document.getElementById('username-input').value = userName;
            document.getElementById('name-input-modal').style.display = 'flex';
        });

        socket.on('broadcaster-status', (status) => {
            if (isHost) return;

            if (status.hasBroadcaster && status.isBroadcasting) {
                standbyOverlay.style.opacity = '0';
                setTimeout(() => standbyOverlay.style.display = 'none', 300);
                liveBadge.innerText = 'LIVE';
                socket.emit('request-offer');
            } else {
                standbyOverlay.style.display = 'flex';
                standbyOverlay.style.opacity = '1';
                liveBadge.innerText = 'OFFLINE';
                document.getElementById('standby-title').innerText = status.hasBroadcaster ? "配信準備中" : "配信オフライン";
                document.getElementById('standby-desc').innerText = status.hasBroadcaster ? "まもなく配信が始まります..." : "配信者が参加するまでお待ちください";
            }
        });

        socket.on('broadcaster-approved', async (res) => {
            if (res.success) {
                document.getElementById('role-display').innerText = '配信者';
                document.getElementById('user-id-display').innerText = '';
                hostBtn.style.display = 'block';
                standbyOverlay.style.display = 'none';

                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
                    videoElement.srcObject = localStream;
                } catch (err) { alert("カメラ起動エラー: " + err); }

                hostBtn.addEventListener('click', () => {
                    isBroadcasting = !isBroadcasting;
                    socket.emit('toggle-stream', isBroadcasting);
                    if (isBroadcasting) {
                        hostBtn.innerText = '配信停止';
                        hostBtn.classList.add('is-live');
                        liveBadge.innerText = 'LIVE';
                    } else {
                        hostBtn.innerText = '配信開始';
                        hostBtn.classList.remove('is-live');
                        liveBadge.innerText = 'PREPARE';
                    }
                });

                socket.on('request-offer-from', async (viewerId) => {
                    if (!isBroadcasting) return;
                    createPeerConnection();
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('offer', offer);
                });

            } else {
                alert(res.reason);
                initViewerMode();
            }
        });

        function initViewerMode() {
            if (!userName) {
                document.getElementById('name-input-modal').style.display = 'flex';
            } else {
                startViewer();
            }
        }

        document.getElementById('btn-save-name').addEventListener('click', () => {
            const input = document.getElementById('username-input').value.trim();
            userName = input || 'ゲスト' + Math.floor(Math.random() * 1000);
            localStorage.setItem('live_user_name', userName);
            document.getElementById('name-input-modal').style.display = 'none';
            startViewer();
        });

        function startViewer() {
            document.getElementById('role-display').innerText = userName;
            document.getElementById('user-id-display').innerText = userId;
            videoElement.muted = false;
            createPeerConnection();
            socket.emit('request-offer');
        }

        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.ontrack = (e) => { videoElement.srcObject = e.streams[0]; };
            peerConnection.onicecandidate = (e) => { if (e.candidate) socket.emit('candidate', e.candidate); };
        }

        socket.on('offer', async (offer) => {
            createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        socket.on('answer', async (answer) => {
            if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('candidate', async (candidate) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        // チャット送信
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('btn-send-chat');

        function triggerSendChat() {
            if (chatInput.value.trim()) {
                socket.emit('send-chat', {
                    user: isHost ? '配信者' : userName,
                    userId: isHost ? '' : userId,
                    isHost: isHost,
                    text: chatInput.value.trim()
                });
                chatInput.value = '';
            }
        }

        sendBtn.addEventListener('click', triggerSendChat);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') triggerSendChat(); });

        socket.on('receive-chat', (data) => {
            const logs = document.getElementById('chat-logs');
            const div = document.createElement('div');
            div.className = 'chat-item';
            
            const hostBadgeHtml = data.isHost ? `<span class="host-badge">HOST</span>` : '';
            const idHtml = data.userId ? `<span class="chat-id">${data.userId}</span>` : '';

            div.innerHTML = `
                <div class="chat-header">
                    ${hostBadgeHtml}
                    <span class="chat-user">${data.user}</span>
                    ${idHtml}
                </div>
                <div class="chat-text">${data.text}</div>
            `;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        });

        // ギフト処理
        const giftDrawer = document.getElementById('gift-drawer');
        document.getElementById('btn-toggle-gift').addEventListener('click', () => {
            giftDrawer.style.display = (giftDrawer.style.display === 'grid') ? 'none' : 'grid';
        });

        function sendGift(giftName, icon, price) {
            giftDrawer.style.display = 'none';
            const senderName = isHost ? '配信者' : (userName || '視聴者さん');
            socket.emit('send-gift', { 
                user: senderName, 
                userId: isHost ? '' : userId, 
                isHost: isHost,
                giftName, 
                icon, 
                price 
            });
        }

        socket.on('receive-gift', (data) => {
            showGiftEffect(data);
            
            const logs = document.getElementById('chat-logs');
            const div = document.createElement('div');
            div.className = 'chat-item gift-notice';
            
            const hostBadgeHtml = data.isHost ? `<span class="host-badge">HOST</span>` : '';
            const idHtml = data.userId ? `<span class="chat-id">${data.userId}</span>` : '';

            // コメント同様に「1行目：ユーザー情報」「2行目：ギフト内容」の2行構成に統一
            div.innerHTML = `
                <div class="chat-header">
                    ${hostBadgeHtml}
                    <span class="chat-user" style="color: #FFF;">${data.user}</span>
                    ${idHtml}
                </div>
                <div class="chat-text">🎁 ${data.icon} ${data.giftName} (${data.price}) を贈りました！</div>
            `;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        });

        function showGiftEffect(data) {
            const container = document.getElementById('effect-container');
            const div = document.createElement('div');
            div.className = 'gift-effect-text';
            div.innerHTML = `${data.icon} ${data.user}さんが<br>${data.giftName} (${data.price}) を贈りました！`;
            container.appendChild(div);
            setTimeout(() => { div.remove(); }, 2200);
        }
    </script>
</body>
</html>
