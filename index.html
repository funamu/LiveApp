<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ライブ配信プロトタイプ</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        #camera-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            background: #111;
        }

        #role-select-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .role-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        .role-btn.viewer {
            background: linear-gradient(135deg, #2af598, #009efd);
            box-shadow: 0 4px 15px rgba(42, 245, 152, 0.4);
        }

        .overlay-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .live-badge {
            background: #ff2a5f;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .footer {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .gift-btn {
            background: linear-gradient(135deg, #ff2a5f, #ff7b00);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
        }

        #effect-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }

        .gift-effect-text {
            font-size: 32px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 20px #ff2a5f;
            animation: popUp 1.5s ease-out forwards;
            max-width: 90%;
            word-wrap: break-word;
            margin: 0 auto;
            line-height: 1.2;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            30% { opacity: 1; transform: scale(1.2) translateY(0); }
            70% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1) translateY(-50px); }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="role-select-screen">
            <h2>配信モードを選んでください</h2>
            <button class="role-btn" id="btn-liver">🔴 配信者 (Liver) として始める</button>
            <button class="role-btn viewer" id="btn-viewer">👀 視聴者 (Viewer) として見る</button>
        </div>

        <video id="camera-video" autoplay playsinline muted></video>

        <div class="overlay-layer">
            <div class="header">
                <span class="live-badge" id="status-badge">LIVE</span>
                <span id="role-display">モード未選択</span>
            </div>

            <div id="effect-container"></div>

            <div class="footer">
                <button class="gift-btn" id="gift-trigger">🎁 ギフトを贈る</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let peerConnection;

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        const videoElement = document.getElementById('camera-video');
        const roleScreen = document.getElementById('role-select-screen');
        const roleDisplay = document.getElementById('role-display');

        // WebRTCの接続管理を作る関数
        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(rtcConfig);

            // 映像を受け取ったときの処理
            peerConnection.ontrack = (event) => {
                console.log('映像を受信しました！');
                videoElement.srcObject = event.streams[0];
            };

            // ネットワーク候補が見つかったら相手に送る
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('candidate', event.candidate);
                }
            };
        }

        // 1. 【配信者として開始】
        document.getElementById('btn-liver').addEventListener('click', async () => {
            roleScreen.style.display = 'none';
            roleDisplay.innerText = '配信者 (Liver)';
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                videoElement.srcObject = localStream;

                // 視聴者から「映像をください」という合図が来たら準備する
                socket.on('request-offer', async () => {
                    console.log('視聴者からのリクエストを受信。オファーを作成します');
                    createPeerConnection();
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                    
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('offer', offer);
                });

            } catch (err) {
                alert("カメラの起動に失敗しました: " + err);
            }
        });

        // 2. 【視聴者として見る】
        document.getElementById('btn-viewer').addEventListener('click', () => {
            roleScreen.style.display = 'none';
            roleDisplay.innerText = '視聴者 (Viewer)';
            videoElement.muted = false;

            createPeerConnection();
            console.log('配信者へ映像のリクエストを送ります');
            socket.emit('request-offer');
        });

        // シグナリング受信
        socket.on('offer', async (offer) => {
            console.log('オファーを受信しました');
            createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', answer);
        });

        socket.on('answer', async (answer) => {
            console.log('アンサーを受信しました');
            if (peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            }
        });

        socket.on('candidate', async (candidate) => {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.error('ICE候補の追加に失敗しました', e);
                }
            }
        });

        // ギフト機能
        document.getElementById('gift-trigger').addEventListener('click', () => {
            socket.emit('send-gift', { userName: '視聴者さん' });
        });

        socket.on('receive-gift', (data) => {
            showGiftEffect(data.userName);
        });

        function showGiftEffect(userName) {
            const container = document.getElementById('effect-container');
            const div = document.createElement('div');
            div.className = 'gift-effect-text';
            div.innerText = `🎉 ${userName}さんがギフトを贈りました！`;
            container.appendChild(div);
            setTimeout(() => { div.remove(); }, 1500);
        }
    </script>
</body>
</html>
