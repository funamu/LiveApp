<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ表示の崩れを防ぐための超重要タグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ライブ配信</title>
  <style>
    /* CSSの共通リセット（隙間やはみ出しを防止） */
    * {
      box-sizing: border-box; /* 枠線や余白を含めてサイズ指定する設定 */
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden; /* 画面全体のスワイプブレを防止 */
    }

    /* 配信者の画面エリア（常にカメラを表示） */
    .broadcaster-container {
      padding: 10px;
      background: #1a1a1a;
      text-align: center;
    }

    .broadcaster-container video {
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      background: #333;
    }

    /* -------------------------------------------------- */
    /* 視聴者スマホ用レイアウト（横はみ出し徹底防止版） */
    /* -------------------------------------------------- */
    .viewer-mobile-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh; /* スマホ画面の高さぴったりに合わせる */
      max-width: 480px; /* パソコンで見てもスマホ幅に維持 */
      margin: 0 auto;
      position: relative;
      background-color: #000;
      overflow: hidden; /* 子要素のはみ出しをシャットアウト */
    }

    /* 1. 映像エリア */
    .video-wrapper {
      position: relative;
      flex: 1; /* 余った縦幅をすべて使う */
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 画面いっぱいに映像を表示 */
    }

    /* 2. コメントエリア（表示時） */
    .comments-container {
      display: flex;
      flex-direction: column;
      width: 100%; /* 横幅ぴったり */
      max-height: 45dvh; /* 画面高さの45%までに制限 */
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    /* コメント一覧（縦スクロール） */
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 12px;
      width: fit-content;
      max-width: 90%;
      word-break: break-all;
    }

    /* 3. 下部の入力＆ボタンエリア（横並びで右端オーバーを防ぐ） */
    .comment-input-bar {
      display: flex;
      align-items: center;
      gap: 8px; /* 要素同士のすき間 */
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.9);
      width: 100%;
      box-sizing: border-box; /* 横幅オーバーを強力に防止 */
    }

    /* テキスト入力欄：自動で横幅を伸縮させる */
    .comment-input-bar input {
      flex: 1; /* 使える横幅をいっぱいまで伸ばす */
      min-width: 0; /* フレックスボックス内で縮小できるようにするおまじない */
      height: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    /* 送信ボタン・ギフトボタン共通：サイズを固定して潰れないようにする */
    .send-button,
    .gift-button {
      flex-shrink: 0; /* 横幅が狭くなっても潰れない設定 */
      height: 40px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-button {
      padding: 0 14px;
      background: #007bff;
      color: #fff;
      font-size: 13px;
    }

    .gift-button {
      width: 40px;
      background: #ff4081;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- ==================== 配信者用エリア ==================== -->
  <div class="broadcaster-container">
    <h3>配信者画面（常に映像確認可能）</h3>
    <!-- ページを開いた時点でカメラが起動して映ります -->
    <video id="localVideo" autoplay playsinline muted></video>
    <br>
    <button id="startLiveBtn" style="margin-top:8px; padding:8px 16px;">配信開始</button>
  </div>

  <hr style="border-color: #333; margin: 20px 0;">

  <!-- ==================== 視聴者用エリア ==================== -->
  <div class="viewer-mobile-container">
    <!-- 配信映像エリア -->
    <div class="video-wrapper">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <!-- コメント表示・入力エリア -->
    <div class="comments-container">
      <!-- コメント一覧（内側でスクロール） -->
      <div class="comments-list">
        <div class="comment-item">ユーザーA: こんにちは！</div>
        <div class="comment-item">ユーザーB: 映像見えていますか？</div>
      </div>

      <!-- 下部操作バー（入力欄・送信・ギフトが右端に溢れないよう調整済み） -->
      <div class="comment-input-bar">
        <input type="text" placeholder="コメントを入力..." />
        <button class="send-button">送信</button>
        <button class="gift-button" aria-label="ギフトを送る">🎁</button>
      </div>
    </div>
  </div>

  <!-- ==================== JavaScript処理 ==================== -->
  <script>
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const startLiveBtn = document.getElementById('startLiveBtn');

    let localStream = null;
    let peerConnection = null;

    const rtcConfiguration = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    // ① 配信者側：ページを開いた時点でカメラを起動して画角確認できるようにする
    async function initCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        if (localVideo) {
          localVideo.srcObject = localStream;
        }
      } catch (error) {
        console.error('カメラ・マイクの読み込みに失敗しました:', error);
      }
    }

    // ② 配信開始ボタンを押した時に視聴者へ送信を開始する処理
    async function startBroadcasting() {
      if (!localStream) await initCamera();

      peerConnection = new RTCPeerConnection(rtcConfiguration);

      // 映像と音声を送信対象に追加
      localStream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignalingMessage({ type: 'candidate', candidate: event.candidate });
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      sendSignalingMessage({ type: 'offer', sdp: peerConnection.localDescription });
    }

    // ③ 視聴者側：配信者の映像を受信して表示する処理
    async function handleReceiveOffer(offerSdp) {
      if (!peerConnection) {
        peerConnection = new RTCPeerConnection(rtcConfiguration);
      }

      peerConnection.ontrack = (event) => {
        if (remoteVideo && !remoteVideo.srcObject) {
          remoteVideo.srcObject = event.streams[0]; // 映像をセット
        }
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignalingMessage({ type: 'candidate', candidate: event.candidate });
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offerSdp));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      sendSignalingMessage({ type: 'answer', sdp: peerConnection.localDescription });
    }

    // ※環境に合わせてシグナリングサーバー連携部分を設定してください
    function sendSignalingMessage(message) {
      // 例: socket.emit('message', message); など
    }

    // 画面読み込み時にカメラ起動
    initCamera();

    if (startLiveBtn) {
      startLiveBtn.addEventListener('click', startBroadcasting);
    }
  </script>
</body>
</html>
